version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app  # Live reload for local development
    environment:
      - DATABASE_URL=sqlite:///./kyc.db

  frontend:
    build: ./frontend
    ports:
      - "3000:80"  # Maps port 3000 on your laptop to port 80 in the container
    depends_on:
      - backend
