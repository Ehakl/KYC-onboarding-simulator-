name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm install || true

    - name: Install Backend Dependencies
      run: |
        cd backend
        npm install || true

    - name: Run Tests (if any exist)
      run: |
        echo "Placeholder for future automated tests"
